name: ${COMPOSE_PROJECT_NAME:-ddna-rebuild}

services:
  db:
    image: mariadb:${MARIADB_VERSION:-11.4.12}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ddna

  wordpress:
    image: wordpress:${WORDPRESS_VERSION:-7.0.2-php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-local}');
        define('WP_HOME', '${WP_URL:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_URL:-http://localhost:8080}');
        define('WP_DEBUG_LOG', filter_var('${WP_DEBUG_LOG:-0}', FILTER_VALIDATE_BOOLEAN));
        define('WP_DEBUG_DISPLAY', false);
        @ini_set('display_errors', '0');
        define('FORCE_SSL_ADMIN', filter_var('${WP_FORCE_HTTPS:-0}', FILTER_VALIDATE_BOOLEAN));
        define('DISABLE_WP_CRON', filter_var('${WP_DISABLE_CRON:-0}', FILTER_VALIDATE_BOOLEAN));
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_core:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - ./app/themes/ddna-theme:/var/www/html/wp-content/themes/ddna-theme
      - ./app/plugins/ddna-core:/var/www/html/wp-content/plugins/ddna-core
      - ./app/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/wordpress/server-name.conf:/etc/apache2/conf-enabled/server-name.conf:ro
      - ./docker/wordpress/wordpress.htaccess:/var/www/html/.htaccess:ro
    networks:
      - ddna

  cli:
    image: wordpress:${WP_CLI_VERSION:-cli-php8.3}
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
    volumes:
      - wordpress_core:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - ./app/themes/ddna-theme:/var/www/html/wp-content/themes/ddna-theme
      - ./app/plugins/ddna-core:/var/www/html/wp-content/plugins/ddna-core
      - ./app/mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - ddna
    entrypoint: ["wp"]
    command: ["--info"]

  init:
    image: wordpress:${WP_CLI_VERSION:-cli-php8.3}
    restart: "no"
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-DDNA Cordoba - Desarrollo}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-ddna_admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-admin-password}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.test}
    volumes:
      - wordpress_core:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - ./app/themes/ddna-theme:/var/www/html/wp-content/themes/ddna-theme
      - ./app/plugins/ddna-core:/var/www/html/wp-content/plugins/ddna-core
      - ./app/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/var/www/html/scripts:ro
    networks:
      - ddna
    entrypoint: ["sh", "/var/www/html/scripts/bootstrap-local.sh"]

volumes:
  db_data:
  wordpress_core:
  wordpress_uploads:

networks:
  ddna:
    driver: bridge
